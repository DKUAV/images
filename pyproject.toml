[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dkuav-images"
version = "0.1.0"
description = "Manifest-driven DKUAV container builds"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.8"]

[project.scripts]
images = "tools.images.cli:main"

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["tools/images/tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
