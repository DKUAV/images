services:
  app:
    build:
      context: ../..
      dockerfile: src/luciole-cuda-dev/Dockerfile
    image: ghcr.io/dkuav/luciole-cuda-dev:latest

    # Dockerfile USER selects luciole; the entrypoint starts sshd through sudo.
    # APP_USER is descriptive metadata and does not change the runtime identity.
    stdin_open: true
    tty: true

    ports:
      # SSH exposed by the entrypoint; map to a host port so you can
      # `ssh -p 2222 luciole@localhost` from the host.
      - "2222:22"

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg

    environment:
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - PULSE_SERVER=${PULSE_SERVER}
      # Descriptive metadata; use docker's --user to select another identity.
      - APP_USER=luciole
