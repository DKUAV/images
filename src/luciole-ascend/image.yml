schema_version: 1
name: luciole-ascend
description: Kunpeng ARM64 and Ascend 910B TorchNPU development environment.
dockerfile: src/luciole-ascend/Dockerfile
context: .
platforms: [linux/arm64]
base:
  image: ascendai/torch-npu:2.14.0-cann9.2.0-910b-ubuntu22.04-py3.12
  digest: null
build_args:
  DEFAULT_USER: luciole
  DEFAULT_UID: 1000
  DEFAULT_GID: 1000
  DEFAULT_GROUPS: ""
  TZ: Asia/Shanghai
  SYSTEM_UPGRADE: false
  CMAKE_VERSION: 4.3.2
  CMAKE_SHA256: 377079ab739f5765176f427609d9a2015b756ea20d5cba908d279c3731a2f481
  DEVSHELL: true
  PACKAGE_MIRROR: upstream
  SSH_MODE: password
  WORKSPACE_DIR: /work
inputs:
  - src/_scripts/system/system.sh
  - src/_scripts/python/python-install.sh
  - src/_assets/ascend-pip-check.sh
  - src/_assets/python-dev-requirements.txt
  - src/_scripts/python/ascend-pip-packages.sh
  - src/_scripts/dev/dev-tools.sh
  - src/_scripts/dev/cmake.sh
  - src/_scripts/system/user.sh
  - src/_scripts/system/ssh.sh
  - src/_scripts/system/workspace.sh
  - src/_scripts/dev/devshell.sh
  - src/_scripts/integrations/ascend-environment.sh
  - src/_scripts/system/finalize-mirror.sh
  - src/_assets/docker-entrypoint.sh
  - src/_assets/ascend-entrypoint.sh
smoke:
  script: src/_tests/smoke-ascend.sh
  inputs: [src/_tests/_lib.sh, src/_tests/npu-ascend.sh]
  policy: required
