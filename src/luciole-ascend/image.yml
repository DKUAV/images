schema_version: 2
name: luciole-ascend
description: Kunpeng ARM64 and Ascend 910B TorchNPU development environment.
dockerfile: src/luciole-ascend/Dockerfile
context: .
platforms:
- linux/arm64
inputs:
- src/luciole-ascend/requirements.txt
- src/_scripts/dev/luciole-dev-tools.sh
- vendor/image-kit/scripts/system/system.sh
- vendor/image-kit/scripts/python/python-install.sh
- vendor/image-kit/assets/ascend-pip-check.sh
- vendor/image-kit/assets/python-dev-requirements.txt
- vendor/image-kit/scripts/python/ascend-pip-packages.sh
- vendor/image-kit/scripts/python/ascend-python-packages.sh
- vendor/image-kit/scripts/dev/dev-tools.sh
- vendor/image-kit/scripts/dev/cmake.sh
- vendor/image-kit/scripts/system/user.sh
- vendor/image-kit/scripts/system/ssh.sh
- vendor/image-kit/scripts/system/workspace.sh
- vendor/image-kit/scripts/dev/devshell.sh
- vendor/image-kit/scripts/integrations/ascend-environment.sh
- vendor/image-kit/scripts/system/finalize-mirror.sh
- vendor/image-kit/assets/docker-entrypoint.sh
- vendor/image-kit/assets/ascend-entrypoint.sh
publish: true
variants:
- id: 2.14.0-cann9.2.0-910b-ubuntu22.04-py3.12
  base:
    image: ascendai/torch-npu:2.14.0-cann9.2.0-910b-ubuntu22.04-py3.12
    digest: null
  build_args:
    DEFAULT_USER: root
    TZ: Asia/Shanghai
    SYSTEM_UPGRADE: false
    CMAKE_VERSION: 4.3.2
    CMAKE_SHA256: 377079ab739f5765176f427609d9a2015b756ea20d5cba908d279c3731a2f481
    DEVSHELL: true
    PACKAGE_MIRROR: upstream
    SSH_MODE: key-only
    WORKSPACE_DIR: /work
  tests:
  - library: src/_tests/_lib.sh
    script: src/_tests/smoke-ascend.sh
    inputs:
    - src/_tests/_lib.sh
    - src/_tests/npu-ascend.sh
    policy: required
    entrypoint: bash
