services:
  app:
    image: ghcr.io/dkuav/luciole-ascend:2.10.0.post7-cann9.2.0-910b-ubuntu22.04-py3.12
    platform: linux/arm64
    runtime: ascend
    environment:
      ASCEND_VISIBLE_DEVICES: "${ASCEND_VISIBLE_DEVICES:-0,1,2,3,4,5,6,7}"
      SSH_MODE: key-only
    shm_size: 8g
    stdin_open: true
    tty: true
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ports:
      - "8101:22"
    volumes:
      - ./mount:/work
      - ./secret:/root/.ssh
    command: sleep infinity
