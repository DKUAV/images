services:
  app:
    build:
      context: ../..
      dockerfile: src/luciole-ascend/Dockerfile
    image: ghcr.io/dkuav/luciole-ascend:2.14.0-cann9.2.0-910b-ubuntu22.04-py3.12
    stdin_open: true
    tty: true
    environment:
      - SSH_MODE=key-only
    volumes:
      - type: bind
        source: ${SSH_CONFIG_DIR:?Set SSH_CONFIG_DIR to an existing SSH configuration directory}
        target: /root/.ssh
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "2222:22"
