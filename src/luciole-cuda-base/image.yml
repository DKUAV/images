schema_version: 1
name: luciole-cuda-base
description: Shared NVIDIA PyTorch/CUDA base with tools, libraries and user account.
dockerfile: src/luciole-cuda-base/Dockerfile
context: .
platforms: [linux/amd64, linux/arm64]
base:
  image: nvcr.io/nvidia/pytorch:26.06-py3
  digest: null
build_args:
  TZ: Asia/Shanghai
  CMAKE_VERSION: 4.3.2
  LIBDATACHANNEL_VERSION: v0.24.5
  RPCLIB_VERSION: v2.3.0
  ICEORYX_VERSION: v2.0.8
  USERNAME: luciole
  USER_UID: 1000
  USER_GID: 1000
inputs:
  - src/_scripts/system/system.sh
  - src/_scripts/dev/dev-tools.sh
  - src/_scripts/integrations/wslg.sh
  - src/_scripts/python/cuda-pip-packages.sh
  - src/_assets/python-dev-requirements.txt
  - src/_scripts/dev/cmake.sh
  - src/_scripts/libraries/libdatachannel.sh
  - src/_scripts/libraries/rpclib.sh
  - src/_scripts/libraries/iceoryx.sh
  - src/_scripts/system/ssh.sh
  - src/_scripts/system/user.sh
  - src/_assets/docker-entrypoint.sh
smoke:
  script: src/_tests/smoke-base.sh
  inputs: [src/_tests/_lib.sh]
  policy: advisory
