name: Build and publish images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: Image name; leave empty to build all images
        required: false
        type: string

permissions:
  contents: read

# Serialize active publishers while keeping PR validation independent.
concurrency:
  group: images-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publisher' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  plan:
    name: Validate and plan
    runs-on: ubuntu-24.04
    outputs:
      has_build: ${{ steps.plan.outputs.has_build }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      revision: ${{ steps.plan.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install tooling
        run: python -m pip install -e '.[dev]'
      - name: Check tooling and contracts
        run: |
          python -m ruff check tools
          python -m ruff format --check tools
          python -m pytest
          python -m tools.images validate
      - name: Calculate affected images
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          arguments=(--all)
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$(git merge-base "$PR_BASE" "$HEAD_SHA")"
            arguments=(--base "$base" --head "$HEAD_SHA")
          elif [[ "$EVENT_NAME" == workflow_dispatch && -n "$INPUT_IMAGE" ]]; then
            arguments=(--image "$INPUT_IMAGE")
          elif [[ "$EVENT_NAME" == push && "$REF_TYPE" != tag && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            arguments=(--base "$BEFORE_SHA" --head "$HEAD_SHA")
          fi
          python -m tools.images plan "${arguments[@]}" \
            --output build-plan.json --github-output "$GITHUB_OUTPUT"
          echo "revision=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          cat build-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: build-plan
          path: build-plan.json
          if-no-files-found: error

  verify-pr:
    name: PR (${{ matrix.platform }})
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.has_build == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    uses: ./.github/workflows/build-native.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      platform_id: ${{ matrix.platform_id }}
      revision: ${{ needs.plan.outputs.revision }}
      publish: false

  build-publish:
    name: Publish (${{ matrix.platform }})
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.has_build == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    uses: ./.github/workflows/build-native.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      platform_id: ${{ matrix.platform_id }}
      revision: ${{ needs.plan.outputs.revision }}
      publish: true

  merge:
    name: Merge manifests and advance tags
    needs: [plan, build-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: build-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check complete architecture set and merge
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_REVISION: ${{ needs.plan.outputs.revision }}
          IMAGE_REF: ${{ github.ref }}
        run: |
          python -m tools.images merge --plan build-plan.json \
            --owner "$IMAGE_OWNER" --revision "$IMAGE_REVISION" \
            --digests digests --ref "$IMAGE_REF"
