name: Publish Images

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - src/**
      - .github/workflows/publish-images.yml
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changed Images
    runs-on: ubuntu-latest
    outputs:
      tier1_build_matrix:  ${{ steps.detect.outputs.tier1_build_matrix }}
      tier2_build_matrix:  ${{ steps.detect.outputs.tier2_build_matrix }}
      tier1_image_matrix:  ${{ steps.detect.outputs.tier1_image_matrix }}
      tier2_image_matrix:  ${{ steps.detect.outputs.tier2_image_matrix }}
      has_tier1: ${{ steps.detect.outputs.has_tier1 }}
      has_tier2: ${{ steps.detect.outputs.has_tier2 }}
      smoke_matrix:        ${{ steps.detect.outputs.smoke_matrix }}
      has_smoke:           ${{ steps.detect.outputs.has_smoke }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build matrices
        id: detect
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          src_root = pathlib.Path("src")
          event_name = os.environ["GITHUB_EVENT_NAME"]
          before = os.environ.get("GITHUB_EVENT_BEFORE", "")
          sha = os.environ["GITHUB_SHA"]

          with open(src_root / "image-deps.json") as f:
              deps = json.load(f)

          base_images   = set(deps["base_images"])
          dependencies  = deps["dependencies"]   # final -> [base, ...]
          arch_overrides = deps.get("arch_overrides", {})

          # Reverse map: base -> finals that depend on it
          dependents: dict[str, list[str]] = {}
          for final, bases in dependencies.items():
              for base in bases:
                  dependents.setdefault(base, []).append(final)

          DEFAULT_RUNNERS = [
              {"platform": "linux/amd64",  "platform_id": "amd64", "runner": "ubuntu-24.04"},
              {"platform": "linux/arm64",  "platform_id": "arm64", "runner": "ubuntu-24.04-arm"},
          ]

          def build_entries(image_name: str) -> list[dict]:
              overrides = arch_overrides.get(image_name)
              runners = DEFAULT_RUNNERS if not overrides else [
                  r for r in DEFAULT_RUNNERS if r["platform_id"] in overrides
              ]
              base = {
                  "image":      image_name,
                  "context":    ".",
                  "dockerfile": f"src/{image_name}/Dockerfile",
              }
              return [{**base, **r} for r in runners]

          def image_entries(names: list[str]) -> list[dict]:
              return [
                  {"image": n, "context": ".", "dockerfile": f"src/{n}/Dockerfile"}
                  for n in names
              ]

          def get_changed_paths() -> list[str]:
              if before and before != "0000000000000000000000000000000000000000":
                  cmd = ["git", "diff", "--name-only", f"{before}..{sha}", "--", "src"]
              else:
                  cmd = ["git", "ls-files", "src"]
              return subprocess.check_output(cmd, text=True).splitlines()

          if event_name == "workflow_dispatch":
              tier1 = sorted(base_images)
              tier2 = sorted(dependencies.keys())
          else:
              changed = get_changed_paths()
              shared_changed = any(
                  pathlib.PurePosixPath(p).parts[1] in ("_scripts", "_assets")
                  for p in changed if len(pathlib.PurePosixPath(p).parts) >= 2
              )

              if shared_changed:
                  tier1 = sorted(base_images)
                  tier2 = sorted(dependencies.keys())
              else:
                  changed_dirs = {
                      pathlib.PurePosixPath(p).parts[1]
                      for p in changed
                      if len(pathlib.PurePosixPath(p).parts) >= 2
                      and (src_root / pathlib.PurePosixPath(p).parts[1] / "Dockerfile").is_file()
                  }
                  tier1 = sorted(d for d in changed_dirs if d in base_images)
                  tier2_set = {d for d in changed_dirs if d in dependencies}
                  # Transitive: changed base -> rebuild its dependents
                  for base in tier1:
                      tier2_set.update(dependents.get(base, []))
                  tier2 = sorted(tier2_set)

          tier1_build = [e for img in tier1 for e in build_entries(img)]
          tier2_build = [e for img in tier2 for e in build_entries(img)]

          # Smoke test matrix: one entry per (image, arch) we actually build.
          # Each Tier 1 / Tier 2 image maps to a script under src/_tests/.
          # Images start with a known prefix (`luciole-cuda-`); the smoke
          # script is `smoke-<suffix>.sh` (e.g. `luciole-cuda-base` → smoke-base.sh).
          SMOKE_SCRIPTS_AVAILABLE = {
              p.name for p in (src_root / "_tests").glob("smoke-*.sh")
          } if (src_root / "_tests").is_dir() else set()

          def smoke_script(image_name: str) -> str | None:
              suffix = image_name.split("-", 2)[-1] if "-" in image_name else image_name
              script = f"smoke-{suffix}.sh"
              return script if script in SMOKE_SCRIPTS_AVAILABLE else None

          smoke_entries = []
          for entry in (tier1_build + tier2_build):
              script = smoke_script(entry["image"])
              if script is None:
                  continue  # no smoke script for this image — skip silently
              smoke_entries.append({
                  "image":       entry["image"],
                  "platform_id": entry["platform_id"],
                  "runner":      entry["runner"],
                  "tag":         f"sha-{sha[:7]}",
                  "script":      script,
              })

          # Deduplicate (a Tier 2 image may appear once but a Tier 1 base never
          # duplicates its own build entries, so just guard defensively).
          seen = set(); smoke_matrix = []
          for e in smoke_entries:
              key = (e["image"], e["platform_id"])
              if key not in seen:
                  seen.add(key); smoke_matrix.append(e)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"tier1_build_matrix={json.dumps(tier1_build)}", file=out)
              print(f"tier2_build_matrix={json.dumps(tier2_build)}", file=out)
              print(f"tier1_image_matrix={json.dumps(image_entries(tier1))}", file=out)
              print(f"tier2_image_matrix={json.dumps(image_entries(tier2))}", file=out)
              print(f"has_tier1={'true' if tier1_build else 'false'}", file=out)
              print(f"has_tier2={'true' if tier2_build else 'false'}", file=out)
              print(f"smoke_matrix={json.dumps(smoke_matrix)}", file=out)
              print(f"has_smoke={'true' if smoke_matrix else 'false'}", file=out)
          PY

  # ── Tier 1: base images ─────────────────────────────────────────────────────

  build-push-tier1:
    name: Build Tier1 (${{ matrix.image }} ${{ matrix.platform_id }})
    runs-on: ${{ matrix.runner }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_tier1 == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.tier1_build_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive registry coordinates
        id: registry
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}
          outputs: type=image,name=${{ steps.registry.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform_id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform_id }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.image }}
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${{ matrix.image }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform_id }}
          path: /tmp/digests/${{ matrix.image }}/*
          if-no-files-found: error
          retention-days: 1

  merge-tier1:
    name: Merge Tier1 (${{ matrix.image }})
    runs-on: ubuntu-24.04
    needs: [detect-changes, build-push-tier1]
    if: needs.detect-changes.outputs.has_tier1 == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.tier1_image_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive registry coordinates
        id: registry
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/${{ matrix.image }}
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests/${{ matrix.image }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.registry.outputs.image }}@sha256:%s ' *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect ${{ steps.registry.outputs.image }}:${{ steps.meta.outputs.version }}

  # ── Tier 2: final images ────────────────────────────────────────────────────

  build-push-tier2:
    name: Build Tier2 (${{ matrix.image }} ${{ matrix.platform_id }})
    runs-on: ${{ matrix.runner }}
    needs: [detect-changes, merge-tier1]
    # Run when tier2 images are needed; allow tier1 to have been skipped (no base changes)
    if: |
      always() &&
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      (needs.merge-tier1.result == 'success' || needs.merge-tier1.result == 'skipped') &&
      needs.detect-changes.outputs.has_tier2 == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.tier2_build_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive registry coordinates
        id: registry
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute base image tag
        id: base
        run: |
          # If tier1 was rebuilt this run, use the sha tag just pushed.
          # If tier1 was skipped (no base changes), fall back to :latest.
          if [ "${{ needs.merge-tier1.result }}" = "success" ]; then
            echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: BASE_TAG=${{ steps.base.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}
          outputs: type=image,name=${{ steps.registry.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform_id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform_id }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.image }}
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${{ matrix.image }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform_id }}
          path: /tmp/digests/${{ matrix.image }}/*
          if-no-files-found: error
          retention-days: 1

  merge-tier2:
    name: Merge Tier2 (${{ matrix.image }})
    runs-on: ubuntu-24.04
    needs: [detect-changes, build-push-tier2]
    if: |
      always() &&
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.build-push-tier2.result == 'success' &&
      needs.detect-changes.outputs.has_tier2 == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.tier2_image_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive registry coordinates
        id: registry
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/${{ matrix.image }}
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests/${{ matrix.image }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.registry.outputs.image }}@sha256:%s ' *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect ${{ steps.registry.outputs.image }}:${{ steps.meta.outputs.version }}

  # ── Smoke tests ─────────────────────────────────────────────────────────────
  # Pulls each image that was actually built this run (at its sha-tag),
  # runs the matching src/_tests/smoke-<image>.sh against it on a native
  # arch runner (no QEMU), and fails the pipeline on any assertion error.
  # This guards against regressions like the OpenCV 4.7.0 leak or a wrong
  # ROS_TARGET apt package name sneaking into a published image.
  smoke-test:
    name: Smoke (${{ matrix.image }} ${{ matrix.platform_id }})
    runs-on: ${{ matrix.runner }}
    needs: [detect-changes, merge-tier1, merge-tier2]
    # Always evaluate, but only run when at least one tier was built & merged
    # AND a smoke script exists for the matrix image.
    if: |
      always() &&
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.has_smoke == 'true' &&
      (needs.merge-tier1.result == 'success' || needs.merge-tier2.result == 'success')
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.smoke_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive registry coordinates
        id: registry
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: docker pull ${{ steps.registry.outputs.image }}:${{ matrix.tag }}

      - name: Run smoke test
        run: |
          # Mount the checked-out `src/_tests/` into /tmp/smoke inside the
          # container and invoke the matching smoke-*.sh. The base image's
          # default user (luciole) is preserved via --user, and the home dir
          # is a fresh tmpfs so devshell dotfiles live in their expected place.
          script="/tmp/smoke/${{ matrix.script }}"
          docker run --rm \
            -v "$PWD/src/_tests:/tmp/smoke:ro" \
            ${{ steps.registry.outputs.image }}:${{ matrix.tag }} \
            bash -lc '
              set -uo pipefail
              # shellcheck disable=SC1091
              . /tmp/smoke/_lib.sh
              # shellcheck disable=SC1090
              source "'"$script"'"
            '
