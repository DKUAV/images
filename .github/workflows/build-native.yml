name: Native image build

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      platform_id:
        type: string
        required: true
      revision:
        type: string
        required: true
      publish:
        type: boolean
        required: true

# Permissions are inherited from the caller: PRs receive contents:read only.
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    env:
      IMAGE_OWNER: ${{ github.repository_owner }}
      IMAGE_REPOSITORY: ${{ github.repository }}
      IMAGE_REVISION: ${{ inputs.revision }}
      IMAGE_PLATFORM: ${{ inputs.platform }}
      IMAGE_ARCH: ${{ inputs.platform_id }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: build-plan
      - name: Free disk space for CUDA builds
        shell: bash
        run: |
          df -h /
          # Installation happens inside the images. These hosted-runner SDKs
          # are unused; retain Python, Node, Docker and the checked-out inputs.
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android \
            /usr/local/.ghcup /opt/ghc /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          # Run before creating the builder so its image/cache is preserved.
          docker image prune --all --force
          df -h /
      - uses: docker/setup-buildx-action@v3
        with:
          # One worker now builds the entire dependency graph. Limit concurrent
          # installation steps in the large dev/runtime branches.
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - name: Render current commit for tests
        run: |
          python -m tools.images bake --plan build-plan.json \
            --owner "$IMAGE_OWNER" --repository "$IMAGE_REPOSITORY" \
            --revision "$IMAGE_REVISION" --platform "$IMAGE_PLATFORM" \
            --mode load --github-cache --output docker-bake.load.json
      - name: Build current commit for tests
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-bake.load.json
      - name: Run manifest smoke contracts
        run: |
          python -m tools.images test --plan build-plan.json \
            --owner "$IMAGE_OWNER" --revision "$IMAGE_REVISION" \
            --platform "$IMAGE_PLATFORM"
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Render publication graph
        if: inputs.publish
        run: |
          python -m tools.images bake --plan build-plan.json \
            --owner "$IMAGE_OWNER" --repository "$IMAGE_REPOSITORY" \
            --revision "$IMAGE_REVISION" --platform "$IMAGE_PLATFORM" \
            --mode publish --github-cache --output docker-bake.publish.json
      - name: Push selected images by digest
        id: publish
        uses: docker/bake-action@v6
        if: inputs.publish
        with:
          source: .
          files: docker-bake.publish.json
      - name: Collect publication digests
        if: inputs.publish
        run: |
          # Provenance for the whole graph can exceed Linux's per-variable
          # exec limit. Serialize it into this script, then write via stdin.
          # toJSON supplies a JS string literal; the quoted heredoc prevents
          # shell expansion of metadata contents.
          node <<'WRITE_BUILD_METADATA'
          const fs = require('node:fs');
          fs.writeFileSync('build-metadata.json', ${{ toJSON(steps.publish.outputs.metadata) }});
          WRITE_BUILD_METADATA
          python -m tools.images collect --plan build-plan.json \
            --owner "$IMAGE_OWNER" --revision "$IMAGE_REVISION" \
            --platform "$IMAGE_PLATFORM" --metadata build-metadata.json \
            --output "digests/$IMAGE_ARCH.json"
      - uses: actions/upload-artifact@v4
        if: inputs.publish
        with:
          name: digests-${{ inputs.platform_id }}
          path: digests/*.json
          if-no-files-found: error
      - name: Report disk usage
        if: always()
        shell: bash
        run: |
          df -h /
          docker system df
      - name: Save generated configuration and metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output-${{ inputs.platform_id }}
          path: |
            docker-bake*.json
            build-metadata*.json
          if-no-files-found: warn
